[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: requiere MongoDB real con autenticación"]

[tool.coverage.run]
relative_files = true
# Ejecutar la cobertura desde la raíz, como hace Dockerfile.test.
source = ["backend/app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]
