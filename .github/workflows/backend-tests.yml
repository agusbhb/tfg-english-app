name: TrAIner CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  integration:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Pruebas con MongoDB aislado
        run: >-
          docker compose -p trainer-tests -f compose.test.yml up
          --build --abort-on-container-exit --exit-code-from tests --attach tests
      - name: Extraer cobertura del contenedor
        run: docker compose -p trainer-tests -f compose.test.yml cp tests:/workspace/coverage.xml coverage.xml
      - name: Comprobar rutas de cobertura
        run: python3 scripts/check_coverage.py coverage.xml
      - name: Publicar cobertura de esta ejecución
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7
      - name: Limpiar instancia de pruebas
        if: always()
        run: docker compose -p trainer-tests -f compose.test.yml down --remove-orphans

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Publicar cobertura del frontend
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  sonarqube:
    name: SonarQube
    needs: [integration, frontend]
    # Compatible con Free: main y PR internas hacia main; nunca analiza develop.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recuperar cobertura de esta ejecución
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-coverage
          path: .
      - name: Comprobar informe en el checkout de Sonar
        run: python3 scripts/check_coverage.py coverage.xml
      - name: Recuperar cobertura del frontend
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Comprobar rutas LCOV
        run: node frontend/scripts/prepare-coverage.js
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
