# Proyecto independiente: docker compose -p trainer-tests -f compose.test.yml ...
services:
  mongodb-test:
    image: mongo:8.0.38
    entrypoint: [bash, /opt/trainer/mongo-replica.sh]
    environment:
      MONGO_REPLICA_SET: trainer-test
      MONGO_REPLICA_HOST: mongodb-test:27017
      MONGO_INITDB_ROOT_USERNAME: test_admin
      MONGO_INITDB_ROOT_PASSWORD: local_isolated_test_admin_password
      MONGODB_DB: trainer_test_bootstrap
      MONGO_APP_USER: trainer_test
      MONGO_APP_PASSWORD: local_isolated_test_app_password
      MONGO_TEST_MODE: "true"
    tmpfs:
      - /data/db
    volumes:
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/01-app-user.js:ro
      - ./docker/mongo-replica.sh:/opt/trainer/mongo-replica.sh:ro
      - ./docker/mongo-replica-health.js:/opt/trainer/mongo-replica-health.js:ro
    healthcheck:
      test: [CMD, mongosh, --quiet, /opt/trainer/mongo-replica-health.js]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s
  tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      # Esta instancia NO tiene red ni volumen compartidos con desarrollo.
      TEST_MONGODB_URI: mongodb://trainer_test:local_isolated_test_app_password@mongodb-test:27017/?authSource=admin&replicaSet=trainer-test
      REQUIRE_MONGODB_TESTS: "1"
    depends_on:
      mongodb-test:
        condition: service_healthy
